<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a shared account · MyWallet</title>
  <meta name="description" content="Open a MyWallet shared-account invite.">
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --text: #14161f; --muted: #5b6070; --primary: #4f46e5; --border: #e3e5ee; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --card: #181b24; --text: #eef0f6; --muted: #a2a7b8; --primary: #8b85ff; --border: #2a2e3a; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 32px 16px 64px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-top: 16px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: var(--muted); }
    .code { font: 600 34px/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: 4px; margin: 8px 0 16px; overflow-wrap: anywhere; }
    a.button { display: block; text-align: center; text-decoration: none; border-radius: 14px; padding: 13px 18px; margin-top: 10px; font-weight: 600; }
    .primary { background: var(--primary); color: #fff; }
    .outline { border: 1.5px solid var(--border); color: var(--text); }
    .lang { text-align: right; }
    .lang button { font: inherit; border: 0; background: transparent; color: var(--primary); cursor: pointer; }
  </style>
</head>
<body>
<main>
  <div class="lang"><button id="lang" type="button">বাংলা</button></div>
  <h1 data-en="You're invited to a shared account" data-bn="আপনাকে একটি শেয়ার করা অ্যাকাউন্টে আমন্ত্রণ জানানো হয়েছে"></h1>
  <p data-en="Open the invite in MyWallet, signed in with your MyWallet account. The code works once, for 7 days."
     data-bn="MyWallet-এ সাইন ইন করে আমন্ত্রণটি খুলুন। কোডটি একবারই কাজ করবে, ৭ দিন পর্যন্ত।"></p>
  <div class="card">
    <div data-en="Invite code" data-bn="আমন্ত্রণ কোড"></div>
    <div class="code" id="code">—</div>
    <a class="button primary" id="open" href="#" data-en="Open in MyWallet" data-bn="MyWallet-এ খুলুন"></a>
    <a class="button outline" href="https://play.google.com/store/apps/details?id=com.mdrahim.mywallet" data-en="Get MyWallet on Google Play" data-bn="Google Play থেকে MyWallet নিন"></a>
    <p data-en="Already have the app? Open it, go to Settings → MyWallet account → Join a shared account, and type the code."
       data-bn="অ্যাপটি আছে? খুলে সেটিংস → MyWallet অ্যাকাউন্ট → শেয়ার করা অ্যাকাউন্টে যোগ দিন-এ গিয়ে কোডটি লিখুন।"></p>
  </div>
</main>
<script>
  const code = (new URLSearchParams(location.search).get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  document.getElementById("code").textContent = code ? code.slice(0, 4) + " " + code.slice(4) : "—";
  document.getElementById("open").href = "mywallet://join?code=" + encodeURIComponent(code);
  let lang = navigator.language.startsWith("bn") ? "bn" : "en";
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-en]").forEach((el) => { el.textContent = el.dataset[lang]; });
    document.getElementById("lang").textContent = lang === "bn" ? "English" : "বাংলা";
  }
  document.getElementById("lang").onclick = () => { lang = lang === "bn" ? "en" : "bn"; applyLang(); };
  applyLang();
</script>
</body>
</html>
