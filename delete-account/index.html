<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete your MyWallet account</title>
  <meta name="description" content="Delete your MyWallet account and the data it keeps in MyWallet's cloud.">
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --text: #14161f; --muted: #5b6070; --primary: #4f46e5; --danger: #d93f3f; --border: #e3e5ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1117; --card: #181b24; --text: #eef0f6; --muted: #a2a7b8; --primary: #8b85ff; --danger: #ff6b6b; --border: #2a2e3a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-top: 16px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    p, li { color: var(--muted); }
    button { font: inherit; border: 0; border-radius: 14px; padding: 13px 18px; width: 100%; cursor: pointer; margin-top: 10px; }
    .primary { background: var(--primary); color: #fff; }
    .outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
    .danger { background: var(--danger); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    input { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: transparent; color: var(--text); margin-top: 8px; }
    .lang { text-align: right; }
    .lang button { width: auto; padding: 6px 12px; margin: 0; background: transparent; color: var(--primary); }
    .note { font-size: 14px; }
    .error { color: var(--danger); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="lang"><button id="lang" type="button">বাংলা</button></div>
  <h1 data-en="Delete your MyWallet account" data-bn="আপনার MyWallet অ্যাকাউন্ট মুছুন"></h1>
  <p data-en="You can also do this in the app: Settings → MyWallet account → Delete MyWallet account."
     data-bn="অ্যাপেও করা যায়: সেটিংস → MyWallet অ্যাকাউন্ট → MyWallet অ্যাকাউন্ট মুছুন।"></p>

  <div class="card">
    <h2 data-en="What is deleted" data-bn="যা মুছে যাবে"></h2>
    <ul>
      <li data-en="Your profile: name, email, language and currency."
          data-bn="আপনার প্রোফাইল: নাম, ইমেইল, ভাষা আর মুদ্রা।"></li>
      <li data-en="The list of phones signed in to your account."
          data-bn="আপনার অ্যাকাউন্টে সাইন ইন করা ফোনের তালিকা।"></li>
      <li data-en="Your sign-in (Google or email) with MyWallet."
          data-bn="MyWallet-এ আপনার সাইন ইন (Google বা ইমেইল)।"></li>
    </ul>
    <p class="note" data-en="Your transactions and messages stay on your phone until you uninstall the app or erase its data. Accounts others shared with you are left. If you share an account with other people, stop sharing it in the app first. Google may keep backup copies for a limited time before erasing them."
       data-bn="আপনার লেনদেন আর মেসেজ অ্যাপ আনইনস্টল বা তথ্য মুছে না ফেলা পর্যন্ত আপনার ফোনেই থাকে। অন্যদের শেয়ার করা অ্যাকাউন্ট থেকে আপনি বেরিয়ে যাবেন। আপনি কোনো অ্যাকাউন্ট অন্যদের সাথে শেয়ার করলে আগে অ্যাপে শেয়ার বন্ধ করুন। Google কিছু সময় ব্যাকআপ কপি রাখতে পারে, তারপর মুছে ফেলে।"></p>
  </div>

  <div class="card" id="signin">
    <h2 data-en="First, confirm it's you" data-bn="প্রথমে নিশ্চিত করুন যে এটা আপনি"></h2>
    <p data-en="Sign in the way you sign in to the app." data-bn="অ্যাপে যেভাবে সাইন ইন করেন, সেভাবে সাইন ইন করুন।"></p>
    <button class="primary" id="google" type="button" data-en="Continue with Google" data-bn="Google দিয়ে চালিয়ে যান"></button>
    <button class="outline" id="emailStart" type="button" hidden data-en="Continue with email" data-bn="ইমেইল দিয়ে চালিয়ে যান"></button>
    <p class="note" id="emailAsk" data-en="Can't sign in with Google? Write to mywalletapps@gmail.com from your account's email address and we'll delete the account."
       data-bn="Google দিয়ে সাইন ইন করতে পারছেন না? আপনার অ্যাকাউন্টের ইমেইল ঠিকানা থেকে mywalletapps@gmail.com-এ লিখুন, আমরা অ্যাকাউন্টটি মুছে দেব।"></p>
    <div id="emailBox" hidden>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
      <button class="primary" id="sendCode" type="button" data-en="Send code" data-bn="কোড পাঠান"></button>
      <div id="codeBox" hidden>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
        <button class="primary" id="verify" type="button" data-en="Verify" data-bn="যাচাই করুন"></button>
      </div>
    </div>
  </div>

  <div class="card" id="confirm" hidden>
    <h2 data-en="Delete this account?" data-bn="এই অ্যাকাউন্ট মুছবেন?"></h2>
    <p id="who"></p>
    <button class="danger" id="delete" type="button" data-en="Delete MyWallet account" data-bn="MyWallet অ্যাকাউন্ট মুছুন"></button>
    <button class="outline" id="cancel" type="button" data-en="Cancel" data-bn="বাতিল"></button>
  </div>

  <div class="card" id="done" hidden>
    <h2 data-en="Your MyWallet account was deleted" data-bn="আপনার MyWallet অ্যাকাউন্ট মুছে ফেলা হয়েছে"></h2>
    <p data-en="You can keep using the app without an account." data-bn="অ্যাকাউন্ট ছাড়াই অ্যাপ ব্যবহার করতে পারবেন।"></p>
  </div>

  <p class="error" id="error" hidden></p>
  <p class="note" data-en="Questions: mywalletapps@gmail.com" data-bn="প্রশ্ন থাকলে: mywalletapps@gmail.com"></p>
</main>

<script type="module">
  // The web app "MyWallet website (account deletion)" in Firebase. A web key only names the project;
  // the security rules guard the data. mywallet.mdrahim.com is an authorized domain for sign-in.
  const firebaseConfig = {
    apiKey: "AIzaSyCOhjgtXeov2Br6n9lzflZZmeawldNWGkA",
    authDomain: "mywallet-apps.firebaseapp.com",
    projectId: "mywallet-apps",
    appId: "1:859416316460:web:9139ec8fcca22dcf59df89",
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCustomToken, deleteUser, signOut, getAdditionalUserInfo }
    from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";
  import { getFirestore, collection, getDocs, getDoc, doc, deleteDoc, query, where, updateDoc, deleteField, arrayRemove, serverTimestamp, FieldPath }
    from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  let lang = navigator.language.startsWith("bn") ? "bn" : "en";
  const text = {
    en: { signedIn: (w) => `Signed in as ${w}.`, failed: "Something went wrong. Try again.", wrongCode: "That code isn't right.", badEmail: "Enter a valid email address.", noAccount: "There's no MyWallet account with this email.", sharing: (n) => `You share “${n}” with other people. Stop sharing it in the app (the account → people icon), then try again.` },
    bn: { signedIn: (w) => `${w} হিসেবে সাইন ইন করা।`, failed: "কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।", wrongCode: "কোডটি ঠিক নয়।", badEmail: "সঠিক একটি ইমেইল ঠিকানা লিখুন।", noAccount: "এই ইমেইলে কোনো MyWallet অ্যাকাউন্ট নেই।", sharing: (n) => `আপনি “${n}” অন্যদের সাথে শেয়ার করছেন। অ্যাপে শেয়ার বন্ধ করুন (অ্যাকাউন্ট → মানুষ আইকন), তারপর আবার চেষ্টা করুন।` },
  };
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-en]").forEach((el) => { el.textContent = el.dataset[lang]; });
    $("lang").textContent = lang === "bn" ? "English" : "বাংলা";
  }
  $("lang").onclick = () => { lang = lang === "bn" ? "en" : "bn"; applyLang(); };
  applyLang();

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const functions = getFunctions(app, "asia-south1");
  let email = "";

  // Email codes need the Cloud Functions; they're offered once switched on (Firestore config/app)
  getDoc(doc(db, "config", "app")).then((snap) => {
    if (snap.exists() && snap.data().emailSignIn === true) {
      $("emailStart").hidden = false;
      $("emailAsk").hidden = true;
    }
  }).catch(() => {});

  function showError(message) { $("error").textContent = message; $("error").hidden = !message; }
  function signedIn(user) {
    $("signin").hidden = true;
    $("confirm").hidden = false;
    $("who").textContent = text[lang].signedIn(user.email || user.phoneNumber || user.uid);
  }

  $("google").onclick = async () => {
    showError("");
    try {
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      // A Google account that never used MyWallet: nothing to delete, so don't leave a new one behind
      if (getAdditionalUserInfo(cred)?.isNewUser) {
        await deleteUser(cred.user);
        showError(text[lang].noAccount);
        return;
      }
      signedIn(cred.user);
    }
    catch (e) { if (e.code !== "auth/popup-closed-by-user") showError(text[lang].failed); }
  };
  // The same email codes as the app (functions/emailCode.js)
  $("emailStart").onclick = () => { $("emailBox").hidden = false; $("email").focus(); };
  $("sendCode").onclick = async () => {
    showError("");
    email = $("email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError(text[lang].badEmail); return; }
    try {
      await httpsCallable(functions, "sendEmailCode")({ email, lang });
      $("codeBox").hidden = false;
      $("code").focus();
    } catch (e) { showError(text[lang].failed); }
  };
  $("verify").onclick = async () => {
    showError("");
    try {
      const result = (await httpsCallable(functions, "verifyEmailCode")({ email, code: $("code").value.trim() })).data;
      // "created" means no account had this email: nothing to delete, so don't leave a new one behind
      if (result.status === "created") {
        const cred = await signInWithCustomToken(auth, result.token);
        await deleteUser(cred.user);
        showError(text[lang].noAccount);
        return;
      }
      signedIn((await signInWithCustomToken(auth, result.token)).user);
    } catch (e) { showError(e.code === "functions/invalid-argument" ? text[lang].wrongCode : text[lang].failed); }
  };
  $("cancel").onclick = async () => { await signOut(auth); location.reload(); };

  // The same steps as the app: shared accounts (refused while sharing with others; leave the ones
  // others shared; close ones shared with nobody), devices, the profile, then the sign-in itself
  $("delete").onclick = async () => {
    showError("");
    $("delete").disabled = true;
    const user = auth.currentUser;
    try {
      const shares = await getDocs(query(collection(db, "sharedAccounts"), where("memberUids", "array-contains", user.uid)));
      const busy = shares.docs.find((s) => s.data().ownerUid === user.uid && s.data().memberUids.length > 1);
      if (busy) {
        showError(text[lang].sharing(busy.data().name));
        $("delete").disabled = false;
        return;
      }
      for (const s of shares.docs) {
        if (s.data().ownerUid === user.uid) {
          const entries = await getDocs(collection(db, "sharedAccounts", s.id, "transactions"));
          for (const e of entries.docs) await deleteDoc(e.ref);
          await deleteDoc(s.ref);
        } else {
          await updateDoc(s.ref, new FieldPath("members", user.uid), deleteField(), "memberUids", arrayRemove(user.uid), "updatedAt", serverTimestamp());
        }
      }
      const devices = await getDocs(collection(db, "users", user.uid, "devices"));
      for (const d of devices.docs) await deleteDoc(d.ref);
      await deleteDoc(doc(db, "users", user.uid));
      await deleteUser(user);
      $("confirm").hidden = true;
      $("done").hidden = false;
    } catch (e) {
      showError(text[lang].failed);
      $("delete").disabled = false;
    }
  };
</script>
</body>
</html>
