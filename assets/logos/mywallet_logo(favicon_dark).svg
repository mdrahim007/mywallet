<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="neonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1442a8" />
      <stop offset="100%" stop-color="#2a75ff" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b85d" />
      <stop offset="100%" stop-color="#33ff99" />
    </linearGradient>

    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#fff1b8" />
      <stop offset="65%" stop-color="#e6c245" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffdf73" flood-opacity="0.35" />
    </filter>

    <clipPath id="goldLineClip">
      <rect x="-100" y="-100" width="293.5" height="500" />
      <circle cx="193.5" cy="157" r="78" />
    </clipPath>

    <clipPath id="customCutsClip">
      <polygon points="
        -100,-100 
        153.5,-100 
        153.5,120 
        198.5,120 
        198.5,-100 
        400,-100 
        400,188 
        -100,188
      " />
    </clipPath>
  </defs>

  <g>
    <rect x="28.5" y="90" width="165" height="135" rx="30" fill="url(#neonBlue)" />
    <circle cx="193.5" cy="157" r="78" fill="url(#neonGreen)" opacity="0.9" />

    <g clip-path="url(#goldLineClip)">
      <g filter="url(#neonGlow)">
        <g clip-path="url(#customCutsClip)">
          <path d="M 70 200 L 113.5 120 L 146.5 185 L 180.5 120 L 206.5 170 L 260.5 75" 
                fill="none" 
                stroke="url(#goldGradDark)" 
                stroke-width="15" 
                stroke-linejoin="miter" 
                stroke-miterlimit="4"
                stroke-linecap="butt" />
        </g>
      </g>
    </g>
  </g>
</svg>
