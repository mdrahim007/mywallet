<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05226c" />
      <stop offset="100%" stop-color="#1050c6" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00964d" />
      <stop offset="100%" stop-color="#26de7d" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc9447" />
      <stop offset="30%" stop-color="#fceda4" />
      <stop offset="65%" stop-color="#cba750" />
      <stop offset="100%" stop-color="#ebd17d" />
    </linearGradient>

    <!-- Shadow specifically for the gold line only (Flat design for base shapes) -->
    <filter id="lineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25" />
    </filter>
    
    <!-- Precision Clipping Paths -->
    <clipPath id="goldLineClip">
      <rect x="0" y="0" width="455" height="500" />
      <circle cx="455" cy="207" r="78" />
    </clipPath>

    <clipPath id="customCutsClip">
      <polygon points="
        0,0 
        415,0 
        415,170 
        460,170 
        460,0 
        800,0 
        800,238 
        0,238
      " />
    </clipPath>
  </defs>

  <!-- Centered Layout Group (Logo Top, Text Bottom) -->
  <g transform="translate(0, -5)">
    <!-- Blue Rectangle (Shadow removed) -->
    <rect x="290" y="140" width="165" height="135" rx="30" fill="url(#blueGrad)" />

    <!-- Green Circle (Shadow removed) -->
    <circle cx="455" cy="207" r="78" fill="url(#greenGrad)" opacity="0.88" />

    <!-- Gold Chart Line -->
    <g clip-path="url(#goldLineClip)">
      <g filter="url(#lineShadow)">
        <g clip-path="url(#customCutsClip)">
          <path d="M 331.5 250 L 375 170 L 408 235 L 442 170 L 468 220 L 522 125" 
                fill="none" 
                stroke="url(#goldGrad)" 
                stroke-width="15" 
                stroke-linejoin="miter" 
                stroke-miterlimit="4"
                stroke-linecap="butt" />
        </g>
      </g>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="355" font-family="'Product Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" fill="#4b4b4b" text-anchor="middle" letter-spacing="-0.5">
    <tspan font-weight="400">My</tspan><tspan font-weight="700">Wallet</tspan>
  </text>
</svg>
