<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradDark" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e222a" />
      <stop offset="100%" stop-color="#0b0d10" />
    </radialGradient>

    <linearGradient id="neonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1442a8" />
      <stop offset="100%" stop-color="#2a75ff" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b85d" />
      <stop offset="100%" stop-color="#33ff99" />
    </linearGradient>

    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#fff1b8" />
      <stop offset="65%" stop-color="#e6c245" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffdf73" flood-opacity="0.35" />
    </filter>

    <clipPath id="goldLineClip">
      <rect x="0" y="0" width="455" height="500" />
      <circle cx="455" cy="207" r="78" />
    </clipPath>

    <clipPath id="customCutsClip">
      <polygon points="
        0,0 
        415,0 
        415,170 
        460,170 
        460,0 
        800,0 
        800,238 
        0,238
      " />
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradDark)" />

  <g transform="translate(0, -5)">
    <rect x="290" y="140" width="165" height="135" rx="30" fill="url(#neonBlue)" />
    <circle cx="455" cy="207" r="78" fill="url(#neonGreen)" opacity="0.9" />

    <g clip-path="url(#goldLineClip)">
      <g filter="url(#neonGlow)">
        <g clip-path="url(#customCutsClip)">
          <path d="M 331.5 250 L 375 170 L 408 235 L 442 170 L 468 220 L 522 125" 
                fill="none" 
                stroke="url(#goldGradDark)" 
                stroke-width="15" 
                stroke-linejoin="miter" 
                stroke-miterlimit="4"
                stroke-linecap="butt" />
        </g>
      </g>
    </g>
  </g>

  <text x="400" y="355" font-family="'Product Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    <tspan font-weight="400">My</tspan><tspan font-weight="700">Wallet</tspan>
  </text>
</svg>
