<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neonBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1442a8" />
      <stop offset="100%" stop-color="#2a75ff" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b85d" />
      <stop offset="100%" stop-color="#33ff99" />
    </linearGradient>

    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#fff1b8" />
      <stop offset="65%" stop-color="#e6c245" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffdf73" flood-opacity="0.35" />
    </filter>

    <clipPath id="goldLineClip">
      <rect x="-50" y="-50" width="255" height="300" />
      <circle cx="205" cy="107" r="78" />
    </clipPath>

    <clipPath id="customCutsClip">
      <polygon points="
        -50,-50 
        165,-50 
        165,70 
        210,70 
        210,-50 
        750,-50 
        750,138 
        -50,138
      " />
    </clipPath>
  </defs>

  <g>
    <rect x="40" y="40" width="165" height="135" rx="30" fill="url(#neonBlue)" />
    <circle cx="205" cy="107" r="78" fill="url(#neonGreen)" opacity="0.9" />

    <g clip-path="url(#goldLineClip)">
      <g filter="url(#neonGlow)">
        <g clip-path="url(#customCutsClip)">
          <path d="M 81.5 150 L 125 70 L 158 135 L 192 70 L 218 120 L 272 25" 
                fill="none" 
                stroke="url(#goldGradDark)" 
                stroke-width="15" 
                stroke-linejoin="miter" 
                stroke-miterlimit="4"
                stroke-linecap="butt" />
        </g>
      </g>
    </g>
  </g>

  <text x="320" y="135" font-family="'Product Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" fill="#ffffff" text-anchor="start" letter-spacing="-1">
    <tspan font-weight="400">My</tspan><tspan font-weight="700">Wallet</tspan>
  </text>
</svg>
